<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WordMagic | Access required</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">W</div>
    <p class="eyebrow">WORDMAGIC ACCESS</p>
    <h1>Access <span>required</span></h1>
    <div class="login-panel">
      <h2>Your Google sign-in worked</h2>
      <p id="accessMessage">This account has not been approved for WordMagic yet.</p>
      <p class="small">Please contact the WordMagic administrator to request access.</p>
      <button id="logoutBtn" class="google-button" type="button">Sign out</button>
    </div>
  </main>
  <script type="module" src="js/access-required.js"></script>
</body>
</html>
